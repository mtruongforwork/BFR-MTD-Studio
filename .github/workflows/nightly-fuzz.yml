name: BFR Nightly Fuzz

# Fuzz đầu vào không đáng tin ở quy mô lớn (kế hoạch test crash/hang, A2). Mặc định CI chỉ chạy 10 000 vòng mỗi mục;
# ban đêm chạy 200 000. Lỗi in kèm seed + số vòng để tái hiện (xem FuzzTests.Fuzz).
on:
  schedule:
    - cron: "0 19 * * *"   # 02:00 giờ Việt Nam
  workflow_dispatch:
    inputs:
      iterations:
        description: "Số vòng mỗi mục"
        default: "200000"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Fuzz
        env:
          BFR_FUZZ_ITERATIONS: ${{ github.event.inputs.iterations || '200000' }}
        run: dotnet test tests/BFR.Core.Tests/BFR.Core.Tests.csproj -c Release --filter "FullyQualifiedName~FuzzTests|FullyQualifiedName~FaultInjectionTests" --verbosity normal
